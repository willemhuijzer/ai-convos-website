  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';

      if (e.origin === window.origin) return true; // https chains; opaque==opaque

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;

n minutes, each followed by ten minutes of questions. the talks set the context, the room does the rest.</p>\n    <p style=\"margin:16px 0 0;max-width:46ch;font-size:clamp(14px,3.2vw,16px);line-height:1.5;color:oklch(0.19 0.012 95 / 0.62);text-wrap:pretty\">scientists, engineers and consultants with deep ml knowledge in one room. you leave knowing someone and something you did not know at 19:00.</p>\n    <div ref=\"{{ stageRef }}\" style=\"position:relative;overflow:hidden;margin-top:16px\">\n      <canvas ref=\"{{ canvasRef }}\" style=\"display:block;width:100%;height:clamp(200px,30vh,320px)\"></canvas>\n      <div ref=\"{{ tipRef }}\" style=\"position:absolute;left:0;top:0;pointer-events:none;opacity:0;transition:opacity 140ms ease;transform:translate(-9999px,-9999px);background:oklch(0.19 0.012 95);color:oklch(0.97 0.004 95);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.06em;padding:6px 9px;white-space:nowrap\"></div>\n    </div>\n  </section>\n\n  <section id=\"events\" style=\"max-width:1180px;margin:0 auto;padding:64px 20px 0;scroll-margin-top:64px\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.14em;color:oklch(0.19 0.012 95 / 0.45)\">november</div>\n    <div style=\"display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px 18px;align-items:baseline;padding:26px 0 24px;margin-top:10px;border-top:1px solid oklch(0.19 0.012 95 / 0.18);border-bottom:1px solid oklch(0.19 0.012 95 / 0.18)\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:0.06em;color:oklch(0.19 0.012 95 / 0.5)\">thu</div>\n      <div style=\"font-size:clamp(22px,5.2vw,40px);line-height:1.05;letter-spacing:-0.025em\">ai convos #4</div>\n      <div style=\"grid-row:span 2;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.7;color:oklch(0.19 0.012 95 / 0.6)\">19:00 till late<br>keizersgracht 452<br><span style=\"color:oklch(0.55 0.14 245)\">free</span></div>\n      <div></div>\n      <div style=\"font-size:clamp(34px,8vw,72px);line-height:0.95;letter-spacing:-0.04em\">05<span style=\"color:oklch(0.19 0.012 95 / 0.32)\">.11.2026</span></div>\n    </div>\n    <div style=\"margin-top:20px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.1em;color:oklch(0.19 0.012 95 / 0.45)\">talks:</div>\n    <div style=\"display:flex;flex-direction:column;gap:2px;margin-top:8px;max-width:70ch\">\n      <sc-for list=\"{{ slots }}\" as=\"slot\" hint-placeholder-count=\"3\">\n        <div style=\"padding:12px 14px;background:oklch(0.94 0.03 300 / 0.55)\">\n          <div style=\"font-size:16px;line-height:1.3;text-wrap:pretty\">{{ slot.label }}</div>\n          <div style=\"margin-top:5px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:oklch(0.5 0.25 275)\">{{ slot.time }}</div>\n        </div>\n      </sc-for>\n    </div>\n    <div style=\"margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:oklch(0.19 0.012 95 / 0.45)\">drinks before and after</div>\n  </section>\n\n  <section style=\"max-width:1180px;margin:0 auto;padding:56px 20px 0\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.14em;color:oklch(0.19 0.012 95 / 0.45)\">past</div>\n    <div style=\"margin-top:16px;padding-left:22px;border-left:2px solid oklch(0.5 0.25 275 / 0.25)\">\n      <sc-for list=\"{{ past }}\" as=\"ev\" hint-placeholder-count=\"3\">\n        <div style=\"position:relative;padding:0 0 40px\">\n          <div style=\"position:absolute;left:-29px;top:8px;width:12px;height:12px;background:oklch(0.5 0.25 275)\"></div>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.06em;color:oklch(0.5 0.25 275)\">{{ ev.date }}</div>\n            <div style=\"font-size:clamp(18px,3.8vw,26px);letter-spacing:-0.025em\">{{ ev.title }}</div>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:oklch(0.19 0.012 95 / 0.5)\">{{ ev.meta }}</div>\n          </div>\n          <div style=\"margin-top:16px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.1em;color:oklch(0.19 0.012 95 / 0.45)\">talks:</div>\n          <div style=\"display:flex;flex-direction:column;gap:2px;margin-top:8px;max-width:70ch\">\n            <sc-for list=\"{{ ev.talks }}\" as=\"talk\" hint-placeholder-count=\"3\">\n              <div style=\"padding:12px 14px;background:oklch(0.94 0.03 300 / 0.55)\" style-hover=\"background:oklch(0.9 0.06 300 / 0.7)\">\n                <div style=\"font-size:16px;line-height:1.3;text-wrap:pretty\">{{ talk.what }}</div>\n                <div style=\"margin-top:5px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:oklch(0.5 0.25 275)\">{{ talk.who }}</div>\n              </div>\n            </sc-for>\n          </div>\n          <div style=\"margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:oklch(0.19 0.012 95 / 0.45)\">drinks before and after</div>\n        </div>\n      </sc-for>\n    </div>\n  </section>\n\n  <section id=\"speak\" style=\"max-width:1180px;margin:0 auto;padding:72px 20px 0;scroll-margin-top:64px\">\n    <h2 style=\"margin:0;max-width:22ch;font-size:clamp(24px,5.4vw,46px);font-weight:400;letter-spacing:-0.03em;line-height:1.06\">got ten minutes of something you actually learned?</h2>\n    <p style=\"margin:16px 0 0;max-width:50ch;font-size:16px;line-height:1.5;color:oklch(0.19 0.012 95 / 0.62)\">one idea, one experiment, one failure worth explaining. send a line about what you would talk about.</p>\n    <a href=\"mailto:hello@aiconvos.nl\" style=\"display:inline-block;margin-top:22px;font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:0.06em;border-bottom:1px solid oklch(0.55 0.14 245);padding-bottom:3px\">hello@aiconvos.nl</a>\n  </section>\n\n  <footer style=\"max-width:1180px;margin:0 auto;padding:88px 20px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:32px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.75;color:oklch(0.19 0.012 95 / 0.6)\">\n    <div>\n      <div style=\"color:oklch(0.19 0.012 95);margin-bottom:8px\">format</div>\n      3 × 10 min talk<br>3 × 10 min q&amp;a<br>drinks before and after\n    </div>\n    <div>\n      <div style=\"color:oklch(0.19 0.012 95);margin-bottom:8px\">address</div>\n      gaide office<br>keizersgracht 452<br>1016 gd amsterdam\n    </div>\n    <div>\n      <div style=\"color:oklch(0.19 0.012 95);margin-bottom:8px\">room</div>\n      scientists<br>engineers<br>consultants\n    </div>\n    <div>\n      <div style=\"color:oklch(0.19 0.012 95);margin-bottom:8px\">contact</div>\n      <a href=\"mailto:hello@aiconvos.nl\">hello@aiconvos.nl</a><br><a href=\"#speak\">propose a talk</a><br><a href=\"#events\">next edition</a>\n    </div>\n  </footer>\n</div>\n</x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(p) {\n    super(p);\n    this.canvasRef = React.createRef();\n    this.stageRef = React.createRef();\n    this.tipRef = React.createRef();\n    this.mouse = { x: -9999, y: -9999, on: false };\n  }\n\n  renderVals() {\n    return {\n      canvasRef: this.canvasRef,\n      stageRef: this.stageRef,\n      tipRef: this.tipRef,\n      slots: [\n        { time: \"19:15 · speaker tba\", label: \"talk title tba\" },\n        { time: \"19:45 · speaker tba\", label: \"talk title tba\" },\n        { time: \"20:15 · speaker tba\", label: \"talk title tba\" }\n      ],\n      past: [\n        {\n          day: \"sat\", date: \"09.05.2026\", title: \"third edition\", meta: \"billy grace · amsterdam\",\n          talks: [\n            { what: \"How Multimodal AI Can Help Doctors Interpret Cancer Research\", who: \"Max Emanuel Feucht - evaluation lead @ kaiko.ai\" },\n            { what: \"True Working of Neural Networks\", who: \"Simon Ilic - PhD at CWI\" },\n            { what: \"Building Seleqt and getting acquired: this are the learnings.\", who: \"Noah van Rijn - Founder @ seleqt\" }\n          ]\n        },\n        {\n          day: \"tue\", date: \"15.04.2025\", title: \"second edition\", meta: \"keizersgracht 452 · amsterdam\",\n          talks: [\n            { what: \"talk title tba\", who: \"speaker tba\" },\n            { what: \"talk title tba\", who: \"speaker tba\" },\n            { what: \"talk title tba\", who: \"speaker tba\" }\n          ]\n        },\n        {\n          day: \"sun\", date: \"24.11.2024\", title: \"first edition\", meta: \"keizersgracht 452 · amsterdam\",\n          talks: [\n            { what: \"talk title tba\", who: \"speaker tba\" },\n            { what: \"talk title tba\", who: \"speaker tba\" },\n            { what: \"talk title tba\", who: \"speaker tba\" }\n          ]\n        }\n      ]\n    };\n  }\n\n  componentDidMount() {\n    const cv = this.canvasRef.current, stage = this.stageRef.current;\n    if (!cv) return;\n    const ctx = cv.getContext(\"2d\");\n    const CELL = 5;\n    const ink = \"25, 26, 24\";\n    const accent = \"58, 58, 226\";\n    const warm = \"206, 128, 186\";\n    let W = 0, H = 0, speaker = null, speakers = [], audience = [], hotspots = [];\n    const particles = [];\n\n    const layout = () => {\n      const r = cv.getBoundingClientRect();\n      const dpr = Math.min(window.devicePixelRatio || 1, 2);\n      W = r.width; H = r.height;\n      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);\n      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n      speaker = { x: W / 2, y: H * 0.74 };\n      const gap = Math.max(9 * CELL, Math.min(W * 0.09, 16 * CELL));\n      speakers = [-1, 0, 1].map((i) => ({ x: W / 2 + i * gap, y: H * 0.74 }));\n      audience = [];\n      const base = Math.min(W * 0.42, H * 0.82);\n      const rings = [0.62, 0.8, 0.98];\n      const maxHalf = W / 2 - CELL * 5;\n      const xMul = Math.min(1.5, maxHalf / (base * rings[rings.length - 1]));\n      rings.forEach((k, ri) => {\n        const rad = base * k;\n        const n = 8 + ri * 4;\n        for (let i = 0; i < n; i++) {\n          const a = Math.PI + (Math.PI * (i + 0.5)) / n;\n          audience.push({ x: speaker.x + Math.cos(a) * rad * xMul, y: speaker.y + Math.sin(a) * rad * 0.66, lit: 0 });\n        }\n      });\n      hotspots = [\n        { x: speaker.x, y: speaker.y, r: Math.max(80, W * 0.14), t: \"3 × 10 min talk\" },\n        { x: speaker.x, y: speaker.y - base * 0.42, r: base * 0.42, t: \"context, not a pitch\" },\n        { x: speaker.x, y: speaker.y - base * 0.66, r: base * 0.7, t: \"10 min q&a\" }\n      ];\n    };\n\n    const px = (x, y, a, col) => {\n      ctx.fillStyle = \"rgba(\" + col + \",\" + a + \")\";\n      ctx.fillRect(Math.round(x / CELL) * CELL, Math.round(y / CELL) * CELL, CELL - 1, CELL - 1);\n    };\n\n    const FIG = [\"01110\", \"01110\", \"00100\", \"11111\", \"00100\", \"00100\", \"01010\", \"01010\"];\n\n    const spawn = (back) => {\n      if (!audience.length) return;\n      const t = audience[(Math.random() * audience.length) | 0];\n      const s = speakers[(Math.random() * speakers.length) | 0] || speaker;\n      const from = back ? t : s, to = back ? s : t;\n      particles.push({\n        x: from.x, y: from.y, ox: from.x, oy: from.y, tx: to.x, ty: to.y,\n        t: 0, sp: 0.008 + Math.random() * 0.008, back: !!back,\n        wob: (Math.random() - 0.5) * (back ? 34 : 22), target: back ? null : t\n      });\n    };\n\n    let raf, last = performance.now(), acc = 0, accBack = 0;\n    const frame = (now) => {\n      const dt = Math.min(now - last, 50); last = now;\n      ctx.clearRect(0, 0, W, H);\n\n      acc += dt; accBack += dt;\n      if (acc > 230) { acc = 0; spawn(false); }\n      if (accBack > 600) { accBack = 0; spawn(true); }\n\n      speakers.forEach((s, si) => {\n        const pulse = 0.55 + 0.45 * Math.abs(Math.sin(now / 520 + si * 1.9));\n        for (let r0 = 0; r0 < FIG.length; r0++) {\n          for (let c = 0; c < 5; c++) {\n            if (FIG[r0][c] !== \"1\") continue;\n            px(s.x + (c - 2) * CELL, s.y + (r0 - 4) * CELL, r0 < 2 ? 0.35 + 0.45 * pulse : 0.72, ink);\n          }\n        }\n      });\n\n      for (const a of audience) {\n        a.lit = Math.max(0, a.lit - dt / 900);\n        px(a.x, a.y, 0.2 + a.lit * 0.65, a.lit > 0.05 ? accent : ink);\n        px(a.x, a.y + CELL, 0.12 + a.lit * 0.4, ink);\n      }\n\n      for (let i = particles.length - 1; i >= 0; i--) {\n        const p = particles[i];\n        p.t += p.sp * (dt / 16.7);\n        if (p.t >= 1) {\n          if (!p.back && p.target) p.target.lit = 1;\n          particles.splice(i, 1); continue;\n        }\n        const e = p.t;\n        let x = p.ox + (p.tx - p.ox) * e;\n        let y = p.oy + (p.ty - p.oy) * e + Math.sin(e * Math.PI) * p.wob;\n        if (this.mouse.on) {\n          const dx = x - this.mouse.x, dy = y - this.mouse.y, d = Math.hypot(dx, dy);\n          if (d < 90 && d > 0.1) { const f = (90 - d) / 90 * 26; x += dx / d * f; y += dy / d * f; }\n        }\n        const fade = Math.sin(e * Math.PI);\n        const col = p.back ? accent : warm;\n        px(x, y, 0.4 + 0.6 * fade, col);\n        px(x, y + (p.back ? CELL : -CELL), 0.3 * fade, col);\n      }\n\n      raf = requestAnimationFrame(frame);\n    };\n\n    const onMove = (ev) => {\n      const r = cv.getBoundingClientRect();\n      this.mouse.x = ev.clientX - r.left; this.mouse.y = ev.clientY - r.top; this.mouse.on = true;\n      const tip = this.tipRef.current; if (!tip) return;\n      let hit = null;\n      for (const h of hotspots) if (Math.hypot(h.x - this.mouse.x, h.y - this.mouse.y) < h.r) { hit = h; break; }\n      if (hit) {\n        tip.textContent = hit.t;\n        tip.style.transform = \"translate(\" + Math.round(this.mouse.x + 14) + \"px,\" + Math.round(this.mouse.y - 30) + \"px)\";\n        tip.style.opacity = \"1\";\n      } else tip.style.opacity = \"0\";\n    };\n    const onLeave = () => {\n      this.mouse.on = false; this.mouse.x = -9999; this.mouse.y = -9999;\n      if (this.tipRef.current) this.tipRef.current.style.opacity = \"0\";\n    };\n\n    layout();\n    this._ro = new ResizeObserver(layout); this._ro.observe(cv);\n    stage.addEventListener(\"mousemove\", onMove);\n    stage.addEventListener(\"mouseleave\", onLeave);\n    this._cleanup = () => {\n      cancelAnimationFrame(raf); this._ro.disconnect();\n      stage.removeEventListener(\"mousemove\", onMove);\n      stage.removeEventListener(\"mouseleave\", onLeave);\n    };\n    raf = requestAnimationFrame(frame);\n  }\n\n  componentWillUnmount() { if (this._cleanup) this._cleanup(); }\n}\n<\u002Fscript>\n\n\n</body></html>"
  </script>
